
name: Build and publish Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ai-spam-detector

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train model and run tests
        run: |
          python -m src.mlops_pipeline
          python -m pytest -q

      - name: Upload model evaluation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: |
            artifacts/model_comparison.json
            artifacts/model_metadata.json
          if-no-files-found: warn

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image model loading
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name ai-spam-detector-ci -p 8000:8000 "$IMAGE"
          cleanup() {
            docker rm -f ai-spam-detector-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          healthy=false
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health -o health.json; then
              if grep -q '"model_loaded":true' health.json; then
                healthy=true
                break
              fi
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            docker logs ai-spam-detector-ci
            echo "Health check failed."
            exit 1
          fi

          cat health.json

  deploy-self-hosted:
    name: Deploy to Windows self-hosted runner
    needs: test-and-build
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    steps:
      - name: Check out source and monitoring scripts
        uses: actions/checkout@v4

      - name: Download model evaluation artifact
        uses: actions/download-artifact@v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: artifacts

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start independent API monitor
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $existing = docker ps -aq --filter 'name=^ai-spam-detector$'
          if ($existing) {
            $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 5
            if ($health.status -ne 'ok' -or $health.model_loaded -ne $true) { throw 'Existing service is not healthy before deployment.' }
            $body = @{text='deployment preflight check'} | ConvertTo-Json -Compress
            $probe = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8000/api/predict' -ContentType 'application/json' -Body $body -TimeoutSec 5
            if (-not $probe.model_version) { throw 'Existing service prediction did not return a model version.' }
          } else {
            Write-Host 'No existing ai-spam-detector container found; proceeding with initial deployment.'
          }
          New-Item -ItemType Directory -Force monitoring | Out-Null
          Remove-Item monitoring\* -Force -ErrorAction SilentlyContinue
          Set-Content -Path monitoring\phase.txt -Value 'pre' -Encoding UTF8
          $monitorScript = Join-Path $PWD '.github\scripts\monitor_deployment.ps1'
          $monitorLog = Join-Path $PWD 'monitoring\api_requests.jsonl'
          $monitorPhase = Join-Path $PWD 'monitoring\phase.txt'
          $monitorStop = Join-Path $PWD 'monitoring\stop'
          $monitor = Start-Process -FilePath powershell.exe -PassThru -ArgumentList @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"{0}"' -f $monitorScript),
            '-BaseUrl', 'http://127.0.0.1:8000', '-LogPath', ('"{0}"' -f $monitorLog),
            '-PhasePath', ('"{0}"' -f $monitorPhase), '-StopPath', ('"{0}"' -f $monitorStop)
          )
          Set-Content monitoring\monitor.pid $monitor.Id
          Start-Sleep -Seconds 5

      - name: Pull and replace local container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ai-spam-detector
          BACKUP_NAME: ai-spam-detector-previous
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -Path monitoring\phase.txt -Value 'deploying' -Encoding UTF8
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $image = '{0}:sha-{1}' -f $env:IMAGE_REPOSITORY, $shortSha

          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw 'Docker image pull failed.' }

          $old = docker ps -aq --filter "name=^$($env:CONTAINER_NAME)$"
          $backup = docker ps -aq --filter "name=^$($env:BACKUP_NAME)$"

          if ($backup) {
            docker rm -f $env:BACKUP_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the previous backup container.' }
          }

          if ($old) {
            docker rename $env:CONTAINER_NAME $env:BACKUP_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Could not rename the existing container.' }

            docker stop $env:BACKUP_NAME
            if ($LASTEXITCODE -ne 0) { throw 'Could not stop the existing container.' }
          }

          try {
            docker run -d --restart unless-stopped --name $env:CONTAINER_NAME -p 8000:8000 $image
            if ($LASTEXITCODE -ne 0) { throw 'Could not start the new container.' }

            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8000/api/health' -TimeoutSec 3
                if ($health.status -eq 'ok' -and $health.model_loaded -eq $true) {
                  $healthy = $true
                  $health | ConvertTo-Json -Compress
                  break
                }
              } catch { }
              Start-Sleep -Seconds 2
            }

            if (-not $healthy) {
              docker logs $env:CONTAINER_NAME
              throw 'New container did not pass the model health check.'
            }

            if ($old) {
              docker rm -f $env:BACKUP_NAME
            }
          } catch {
            docker rm -f $env:CONTAINER_NAME 2>$null | Out-Null
            if ($old) {
              docker rename $env:BACKUP_NAME $env:CONTAINER_NAME
              docker start $env:CONTAINER_NAME
            }
            throw
          }

      - name: Show deployed container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: docker ps --filter "name=^ai-spam-detector$"

      - name: Monitor post-deployment service for 30 seconds
        if: success()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          Set-Content -Path monitoring\phase.txt -Value 'post' -Encoding UTF8
          Start-Sleep -Seconds 30

      - name: Stop monitor and create summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item monitoring\stop -ItemType File -Force | Out-Null
          if (Test-Path monitoring\monitor.pid) {
            $monitorPid = [int](Get-Content monitoring\monitor.pid)
            Wait-Process -Id $monitorPid -Timeout 15 -ErrorAction SilentlyContinue
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\summarize_monitoring.ps1 -LogPath monitoring\api_requests.jsonl -OutputDirectory monitoring

      - name: Publish monitoring summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (Test-Path monitoring\summary.md) { Get-Content monitoring\summary.md | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding UTF8 }

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spam-detector-deployment-${{ github.run_id }}
          path: |
            monitoring/
            artifacts/model_comparison.json
            artifacts/model_metadata.json
          if-no-files-found: warn
