<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 스팸 문자 탐지</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card"><h1>AI 스팸 문자 탐지</h1><p class="lead">문자 내용을 입력하면 학습된 모델이 패턴을 분석합니다.</p><label for="message">문자 메시지</label><textarea id="message" maxlength="2000" placeholder="분석할 문자 메시지를 입력하세요."></textarea><div class="count"><span id="count">0</span>/2000</div><div class="actions"><button id="analyze">분석하기</button><button id="clear" class="secondary">입력 초기화</button></div><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><h2 id="label"></h2><p>예측 점수: <strong id="score"></strong></p><p id="explanation"></p></section><p class="notice">주의: 예측 결과는 실제 스팸 여부를 확정하지 않습니다. 점수는 모델의 상대적 판단 점수이며 정확도나 정답 확률이 아닙니다.</p></main><script src="/static/app.js"></script></body></html>
